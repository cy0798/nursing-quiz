<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>간호조무사 국가고시 300문항</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1E8;
  --bg-2:#EFE9DA;
  --paper:#FFFFFF;
  --ink:#1A2947;
  --ink-soft:#4A5568;
  --ink-mute:#8B95A5;
  --accent:#2D5A87;
  --accent-soft:#DCE7F0;
  --correct:#3A6B4E;
  --correct-soft:#E1EBE3;
  --wrong:#B85C3D;
  --wrong-soft:#F5E4DC;
  --bookmark:#C89B3C;
  --bookmark-soft:#F5EBD4;
  --line:#E8E1D0;
  --line-2:#D6CCB4;
  --shadow-sm:0 2px 8px rgba(26,41,71,0.04);
  --shadow:0 4px 24px rgba(26,41,71,0.06);
  --shadow-lg:0 12px 40px rgba(26,41,71,0.10);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{font-family:'Nanum Myeongjo','Noto Sans KR',serif;font-weight:800;color:var(--ink);letter-spacing:-0.02em}

#app{max-width:640px;margin:0 auto;padding:24px 20px 100px;min-height:100vh}

/* ============ HOME ============ */
.header{margin-bottom:32px}
.header-eyebrow{font-size:11px;letter-spacing:0.2em;color:var(--ink-mute);text-transform:uppercase;font-weight:500;margin-bottom:6px}
.header-title{font-size:28px;line-height:1.2;margin-bottom:4px}
.header-sub{font-size:13px;color:var(--ink-soft)}

.mastery-panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.mastery-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.mastery-label{font-size:12px;letter-spacing:0.15em;color:var(--ink-mute);text-transform:uppercase;font-weight:500}
.mastery-num{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:36px;color:var(--ink);line-height:1}
.mastery-num small{font-size:15px;color:var(--ink-mute);font-weight:400;margin-left:4px}
.mastery-bar{height:6px;background:var(--bg-2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.mastery-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--correct));border-radius:99px;transition:width 0.5s ease}
.mastery-stats{display:flex;gap:20px;font-size:12px;color:var(--ink-soft)}
.mastery-stats span strong{color:var(--ink);font-weight:600}

.section-title{font-size:11px;letter-spacing:0.2em;color:var(--ink-mute);text-transform:uppercase;font-weight:500;margin:28px 0 12px}

.category-list{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.cat-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-align:left;transition:all 0.2s;position:relative;overflow:hidden}
.cat-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.cat-card:active{transform:translateY(0)}
.cat-card-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cat-name{font-weight:700;font-size:16px;color:var(--ink)}
.cat-count{font-size:12px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
.cat-count strong{color:var(--correct);font-weight:600}
.cat-progress{height:4px;background:var(--bg-2);border-radius:99px;overflow:hidden}
.cat-progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 0.4s}

.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.action-btn{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:left;transition:all 0.2s;display:flex;flex-direction:column;gap:4px}
.action-btn:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.action-btn-title{font-size:14px;font-weight:600;color:var(--ink)}
.action-btn-desc{font-size:11px;color:var(--ink-mute)}
.action-btn.wrong{background:var(--wrong-soft);border-color:transparent}
.action-btn.bookmark{background:var(--bookmark-soft);border-color:transparent}
.action-btn.wrong .action-btn-title{color:var(--wrong)}
.action-btn.bookmark .action-btn-title{color:var(--bookmark)}

.footer-actions{display:flex;gap:8px;margin-top:24px;justify-content:center}
.text-btn{font-size:12px;color:var(--ink-mute);padding:6px 12px;border-radius:8px}
.text-btn:hover{background:var(--bg-2);color:var(--ink-soft)}

/* ============ STUDY ============ */
.study-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px}
.top-btn{width:38px;height:38px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-soft);transition:all 0.15s}
.top-btn:hover{background:var(--bg-2)}
.top-btn.active{background:var(--bookmark);border-color:var(--bookmark);color:white}
.study-progress{flex:1;height:6px;background:var(--bg-2);border-radius:99px;overflow:hidden}
.study-progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 0.3s}
.study-count{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.card-stage{perspective:1200px;margin-bottom:24px}
.flashcard{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:32px 26px;min-height:340px;box-shadow:var(--shadow);position:relative;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);transform-style:preserve-3d;cursor:pointer}
.flashcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;padding:32px 26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;border-radius:24px}
.face-back{transform:rotateY(180deg);background:var(--accent-soft)}

.face-eyebrow{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:0.2em;color:var(--ink-mute);text-transform:uppercase;font-weight:500;margin-bottom:20px}
.section-tag{display:inline-block;padding:3px 10px;background:var(--bg-2);border-radius:99px;color:var(--ink-soft);letter-spacing:0.05em}
.face-back .section-tag{background:rgba(45,90,135,0.15);color:var(--accent)}

.q-number{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:14px;color:var(--ink-mute)}
.face-back .q-number{color:var(--accent)}

.q-text{font-size:17px;line-height:1.65;color:var(--ink);flex:1;font-weight:400}
.a-label{font-size:11px;letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;font-weight:600;margin-bottom:12px;margin-top:auto}
.a-text{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:24px;line-height:1.4;color:var(--ink);letter-spacing:-0.01em}

.face-hint{font-size:12px;color:var(--ink-mute);text-align:center;margin-top:20px;letter-spacing:0.05em}

.status-badges{display:flex;gap:6px}
.badge{font-size:10px;padding:2px 8px;border-radius:99px;letter-spacing:0.05em;font-weight:500}
.badge.mastered{background:var(--correct-soft);color:var(--correct)}
.badge.wrong{background:var(--wrong-soft);color:var(--wrong)}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.control-btn{padding:18px 20px;border-radius:16px;font-size:15px;font-weight:600;transition:all 0.15s;border:1.5px solid;display:flex;flex-direction:column;align-items:center;gap:2px}
.control-btn small{font-size:10px;font-weight:400;opacity:0.7;letter-spacing:0.1em;text-transform:uppercase}
.control-btn.again{background:var(--wrong-soft);border-color:var(--wrong-soft);color:var(--wrong)}
.control-btn.again:hover{background:var(--wrong);color:white}
.control-btn.know{background:var(--correct-soft);border-color:var(--correct-soft);color:var(--correct)}
.control-btn.know:hover{background:var(--correct);color:white}
.control-btn:active{transform:scale(0.98)}

.flip-hint{text-align:center;font-size:13px;color:var(--ink-mute);padding:20px 0;font-weight:500}

/* ============ COMPLETE ============ */
.complete-panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:36px 28px;text-align:center;box-shadow:var(--shadow);margin-top:40px}
.complete-icon{font-family:'Nanum Myeongjo',serif;font-size:48px;color:var(--correct);margin-bottom:12px;line-height:1}
.complete-title{font-size:24px;margin-bottom:8px}
.complete-sub{font-size:13px;color:var(--ink-soft);margin-bottom:28px}
.complete-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.stat-item{padding:16px;background:var(--bg-2);border-radius:14px}
.stat-num{font-family:'Nanum Myeongjo',serif;font-size:28px;font-weight:800;line-height:1;margin-bottom:4px}
.stat-num.correct{color:var(--correct)}
.stat-num.wrong{color:var(--wrong)}
.stat-label{font-size:11px;color:var(--ink-mute);letter-spacing:0.1em;text-transform:uppercase}
.primary-btn{display:block;width:100%;padding:16px;background:var(--ink);color:white;border-radius:14px;font-weight:600;font-size:15px;transition:all 0.15s;margin-bottom:8px}
.primary-btn:hover{background:var(--accent)}
.secondary-btn{display:block;width:100%;padding:14px;background:transparent;color:var(--ink-soft);border-radius:14px;font-weight:500;font-size:14px;transition:all 0.15s}
.secondary-btn:hover{background:var(--bg-2);color:var(--ink)}

/* ============ STATS ============ */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stats-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.stats-card-num{font-family:'Nanum Myeongjo',serif;font-size:32px;font-weight:800;line-height:1;margin-bottom:4px}
.stats-card-label{font-size:11px;color:var(--ink-mute);letter-spacing:0.1em;text-transform:uppercase}

.section-detail{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:10px}
.section-detail h3{font-size:14px;margin-bottom:12px}
.detail-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;color:var(--ink-soft)}
.detail-row strong{color:var(--ink);font-weight:600}

.danger-btn{color:var(--wrong);font-size:12px;padding:10px 16px;border-radius:8px;display:block;margin:20px auto 0}
.danger-btn:hover{background:var(--wrong-soft)}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(26,41,71,0.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;backdrop-filter:blur(4px)}
.modal{background:var(--paper);border-radius:20px;padding:28px;max-width:400px;width:100%;box-shadow:var(--shadow-lg)}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{font-size:13px;color:var(--ink-soft);margin-bottom:20px}
.modal-actions{display:flex;gap:8px}
.modal-actions button{flex:1;padding:12px;border-radius:12px;font-weight:600;font-size:14px}
.modal-cancel{background:var(--bg-2);color:var(--ink-soft)}
.modal-confirm{background:var(--wrong);color:white}

/* ============ EMPTY ============ */
.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-family:'Nanum Myeongjo',serif;font-size:56px;color:var(--ink-mute);margin-bottom:16px;line-height:1}
.empty-title{font-size:20px;margin-bottom:8px}
.empty-sub{font-size:13px;color:var(--ink-soft);margin-bottom:24px}

/* animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn 0.25s ease-out}

@media (max-width:420px){
  #app{padding:20px 16px 80px}
  .header-title{font-size:24px}
  .mastery-num{font-size:30px}
  .flashcard,.face{padding:26px 22px}
  .q-text{font-size:16px}
  .a-text{font-size:22px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============ QUESTIONS DATA ============
const QUESTIONS = [
// 기초간호학개요 (1-100)
{id:1,s:1,q:"위 절제 후에 오는 것으로 식사 후 섭취된 음식물이 적절하게 섞이지 않고 정상적인 십이지장의 소화과정을 경유하지 않고 빨리 공장으로 들어가기 때문에 생기게 되는 현상을 무엇이라고 하는가?",a:"급속이동 증후군 (빠른 비움 증후군)"},
{id:2,s:1,q:"간의 대사 기능 장애로 인하여 발생하며 갑작스러운 혼수상태, 착란, 경련과 사지의 떨림, 현기증, 의식상실을 보이는 간성혼수 시 제한해야 하는 영양소는?",a:"단백질"},
{id:3,s:1,q:"우유나 그 외 수분이 기도 내에 들어가서 생긴 폐질환으로 삼킴 곤란이 있는 노인이나 어린 아이들에게 잘 발생되는 질환은?",a:"흡인 폐렴"},
{id:4,s:1,q:"적혈구 생성에 관여하는 비타민 B12가 부족하여 나타나는 빈혈의 종류는?",a:"악성빈혈"},
{id:5,s:1,q:"30대 남성이 복부통증, 구토, 발열을 호소하며 맥버니지점의 압통을 호소할 때 의심되는 질환은?",a:"충수염"},
{id:6,s:1,q:"부갑상샘 절제 수술 후 반드시 확인해야 할 혈액 검사로 옳은 것은?",a:"칼슘"},
{id:7,s:1,q:"항생제, 벌침, 혈청, 땅콩 등으로 피부발진, 저혈압, 호흡곤란 등의 신체반응이 나타났다면 의심할 수 있는 것은?",a:"급성중증과민반응"},
{id:8,s:1,q:"수정체가 혼탁해지고 눈부심 증상이 나타났다면 의심할 수 있는 질환은?",a:"백내장"},
{id:9,s:1,q:"시야가 흐려지고 어눌한 말투를 보이며 사지에 힘이 빠진다고 호소하는 환자에게 의심할 수 있는 증상은?",a:"뇌졸중"},
{id:10,s:1,q:"뇌출혈이 발생한 환자에게 가장 중요한 간호는 두개내압 상승을 방지하는 것이다. 두개내압 상승을 막기 위한 처치는?",a:"머리를 15-30도 상승시킨다"},
{id:11,s:1,q:"협심증 치료에 사용되는 강력한 평활근 이완제로 관상동맥 확장에도 효과가 있는 항협심증 약물은?",a:"나이트로글리세린"},
{id:12,s:1,q:"간경환 환자가 갑작스럽게 정신착란증을 일으킨다. 간성혼수를 의심할 때의 우선적인 식이로 옳은 것은?",a:"단백질제한식이"},
{id:13,s:1,q:"심근경색 예방 목적으로 아스피린을 복용하는 환자에게 관찰해야 할 사항에 속하는 것은?",a:"위장출혈"},
{id:14,s:1,q:"당뇨 합병증으로 오른쪽 발목 이하를 절단한 사람이 오른쪽 발가락이 아프다고 한다. 이 환자가 느끼는 통증은?",a:"환상지통"},
{id:15,s:1,q:"소화성 궤양이 잘 발생하는 부위는?",a:"십이지장"},
{id:16,s:1,q:"에릭슨의 정서적 발달에서 근면성과 열등감이 형성되는 시기는?",a:"학령기 (6-12세)"},
{id:17,s:1,q:"생후 3-4일에 체중이 5-10%에 해당하는 양이 소실하게 되는 현상을 무엇이라고 하는가?",a:"생리적 체중 감소"},
{id:18,s:1,q:"자연분만으로 출생한 신생아의 경우 산도를 지나면서 임균에 노출되어 임균눈염증에 걸릴 수 있는데, 이를 예방하기 위해 사용되는 것은?",a:"1% 질산은"},
{id:19,s:1,q:"태아 만출 후 5가지 항목에 대해 평가를 실시하여 신생아 상태를 결정하는 데 사용되는 사정 방법은?",a:"아프가 점수"},
{id:20,s:1,q:"생후 2-3일경에 나타났다가 약 7일 후에는 거의 없어지며, 출생 후 적혈구가 파괴되어 혈액 내 빌리루빈이 상승하는 데 비해 간기능은 미숙하기 때문에 나타나는 증상은?",a:"신생아황달"},
{id:21,s:1,q:"출생 24시간 이내에 신생아가 처음 배설하는 것으로 끈적끈적하고 냄새가 없는 암녹색 변을 무엇이라고 하는가?",a:"태변"},
{id:22,s:1,q:"신생아의 동작은 대부분 본능적 반사작용으로 이루어져 있는데, 발바닥에서 볼 수 있으며 반사 반응 중 가장 늦게 소실되는 신경 반사로 옳은 것은?",a:"바뱅스키 반사"},
{id:23,s:1,q:"3일 된 신생아에게서 저발육, 반사반응 저하 등의 장애를 조기 발견할 수 있는 것으로 정부에서 무료로 검사해 주는 것은?",a:"선천 대사이상 검사"},
{id:24,s:1,q:"모체의 적혈구와 태아의 적혈구가 항원·항체 반응을 일으킴으로써 용혈성 빈혈을 나타내는 태아적혈모구증의 요인으로 옳은 것은?",a:"태아 Rh+, 어머니 Rh-"},
{id:25,s:1,q:"미숙아가 보육기에서 오랫동안 고농도의 산소를 과잉 공급받았을 경우 실명이 나타날 수 있는 질환으로 옳은 것은?",a:"수정체 뒤 섬유 증식 (미숙아 망막증)"},
{id:26,s:1,q:"육체, 정신, 감정의 일체를 간호하는 것으로 이를 달성하기 위해 간호 지식, 기술, 정신의 조화로운 습득이 요구되는 것은?",a:"전인간호"},
{id:27,s:1,q:"환자에게 마땅히 해야 할 일을 하지 않아 손해가 발생할 경우 간호사의 비윤리적 행위에 해당된다. 이와 관련된 것은?",a:"주의 의무 태만"},

const SECTIONS = {
  1:{name:"기초간호학개요",short:"기초간호"},
  2:{name:"실기 및 법규",short:"실기·법규"},
  3:{name:"지역사회",short:"지역사회"},
};

// ============ STATE ============
const STORAGE_KEY = 'nursing-quiz-v1';
let state = {
  progress: {}, // { [qid]: { status: 'unseen'|'learning'|'mastered', bookmarked: bool, seenCount, wrongCount } }
  session: null,
  view: 'home',
};

function loadState(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) state.progress = JSON.parse(saved);
  }catch(e){}
  // ensure all questions have progress entry
  QUESTIONS.forEach(q=>{
    if(!state.progress[q.id]){
      state.progress[q.id] = {status:'unseen',bookmarked:false,seenCount:0,wrongCount:0};
    }
  });
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
  }catch(e){}
}

// ============ UTILS ============
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getStats(section){
  const qs = section ? QUESTIONS.filter(q=>q.s===section) : QUESTIONS;
  const total = qs.length;
  let mastered=0, learning=0, unseen=0, bookmarked=0, wrong=0;
  qs.forEach(q=>{
    const p = state.progress[q.id];
    if(p.status==='mastered') mastered++;
    else if(p.status==='learning') learning++;
    else unseen++;
    if(p.bookmarked) bookmarked++;
    if(p.wrongCount > 0 && p.status !== 'mastered') wrong++;
  });
  return {total,mastered,learning,unseen,bookmarked,wrong};
}

// ============ SESSION LOGIC ============
function startSession(opts){
  // opts: { section: 1|2|3|null, mode: 'all'|'unseen'|'wrong'|'bookmark'|'random20', shuffle: bool }
  let pool = QUESTIONS.slice();
  if(opts.section) pool = pool.filter(q=>q.s===opts.section);
  if(opts.mode==='unseen') pool = pool.filter(q=>state.progress[q.id].status==='unseen');
  else if(opts.mode==='wrong') pool = pool.filter(q=>state.progress[q.id].wrongCount>0 && state.progress[q.id].status!=='mastered');
  else if(opts.mode==='bookmark') pool = pool.filter(q=>state.progress[q.id].bookmarked);
  
  if(pool.length===0){
    alert('학습할 문제가 없습니다.');
    return;
  }
  
  if(opts.shuffle !== false) pool = shuffle(pool);
  
  if(opts.mode==='random20') pool = pool.slice(0,20);
  
  state.session = {
    questions: pool,
    index: 0,
    flipped: false,
    results: {correct:0, wrong:0},
    startTime: Date.now(),
  };
  state.view = 'study';
  render();
}

function markAnswer(known){
  const s = state.session;
  const q = s.questions[s.index];
  const p = state.progress[q.id];
  p.seenCount++;
  if(known){
    p.status = 'mastered';
    s.results.correct++;
  }else{
    p.status = 'learning';
    p.wrongCount++;
    s.results.wrong++;
  }
  saveState();
  s.index++;
  s.flipped = false;
  if(s.index >= s.questions.length){
    state.view = 'complete';
  }
  render();
}

function toggleBookmark(qid){
  state.progress[qid].bookmarked = !state.progress[qid].bookmarked;
  saveState();
  render();
}

function flipCard(){
  if(state.session){
    state.session.flipped = !state.session.flipped;
    render();
  }
}

  return `

      <div class="complete-icon">✓</div>

}

        </div>
        <div class="stats-card">
          <div class="stats-card-num" style="color:var(--bookmark)">${total.bookmarked}</div>
          <div class="stats-card-label">즐겨찾기</div>
        </div>
      </div>
      
      <div class="section-title">파트별 진도</div>
      ${[1,2,3].map(s=>{
        const st = getStats(s);
        const pct = Math.round(st.mastered/st.total*100);
        return `
          <div class="section-detail">
            <h3>${SECTIONS[s].name}</h3>
            <div class="cat-progress" style="margin-bottom:12px"><div class="cat-progress-fill" style="width:${pct}%"></div></div>
            <div class="detail-row"><span>완료</span><strong>${st.mastered}문항</strong></div>
            <div class="detail-row"><span>학습중</span><strong>${st.learning}문항</strong></div>
            <div class="detail-row"><span>미학습</span><strong>${st.unseen}문항</strong></div>
            <div class="detail-row"><span>정답률</span><strong>${pct}%</strong></div>
          </div>
        `;
      }).join('')}
      
      <button class="danger-btn" onclick="resetProgress()">모든 진도 초기화</button>
    </div>
  `;
}

function resetProgress(){
  if(confirm('정말 모든 학습 기록을 초기화할까요?\n이 작업은 되돌릴 수 없습니다.')){
    QUESTIONS.forEach(q=>{
      state.progress[q.id] = {status:'unseen',bookmarked:false,seenCount:0,wrongCount:0};
    });
    saveState();
    state.view='home';
    render();
  }
}

function render(){
  const app = document.getElementById('app');
  if(state.view==='home') app.innerHTML = renderHome();
  else if(state.view==='study') app.innerHTML = renderStudy();
  else if(state.view==='complete') app.innerHTML = renderComplete();
  else if(state.view==='stats') app.innerHTML = renderStats();
  window.scrollTo(0,0);
}

// keyboard shortcuts
document.addEventListener('keydown', e=>{
  if(state.view !== 'study') return;
  if(e.key===' ' || e.key==='Enter'){
    e.preventDefault();
    if(!state.session.flipped) flipCard();
  }else if(state.session.flipped){
    if(e.key==='1' || e.key==='ArrowLeft') markAnswer(false);
    else if(e.key==='2' || e.key==='ArrowRight') markAnswer(true);
  }
});

// init
loadState();
render();
</script>
</body>
</html>
